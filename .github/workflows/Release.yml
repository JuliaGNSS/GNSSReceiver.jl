---
name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    # semantic-release pushes its own version bump to main, which triggers
    # this workflow again. That re-run races the tag push: when it loses, it
    # does not see the tag it just released, recomputes the same version and
    # fails because the version in Project.toml is already the one it wants
    # to write. The message prefix comes from the release configuration.
    if: "!startsWith(github.event.head_commit.message, 'build(release):')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic-release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          RUNNER_DEBUG: 1
        with:
          branches: |
            ['+([0-9])?(.{+([0-9]),x}).x', 'master', 'main', 'next', 'next-major', {name: 'beta', prerelease: true}, {name: 'alpha', prerelease: true}]
          extends: |
            @ethima/semantic-release-configuration
          extra_plugins: |
            @ethima/semantic-release-configuration
      - name: Notify JuliaRegistrator of new release
        uses: peter-evans/commit-comment@v4
        if: steps.semantic-release.outputs.new_release_published == 'true'
        with:
          sha: ${{ steps.semantic-release.outputs.new_release_git_head }}
          body: |
            @JuliaRegistrator register

            Release notes:

            ${{ steps.semantic-release.outputs.new_release_notes }}
