name: Test
on:
  push:
    branches:
      - 'main'
    tags: ['*']
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        version:
          - '1.12'
          - '1'
          #- 'nightly'
        os:
          - ubuntu-latest
        include:
          # No Windows job: the receiver cannot even precompile there. `GNSSDecoder`'s
          # Galileo E1B decoder builds an `Aff3ct.ConvViterbiDecoder`, and `aff3ct_jll`
          # declares no `libaff3ct_jl` product for Windows, so the call fails with
          # `UndefVarError: libaff3ct_jl not defined in Aff3ct.LibAFF3CT`. Since
          # PositionVelocityTime 5.3 that construction happens inside *its* precompile
          # workload, which makes it a load-time failure for every dependent rather than
          # something a caller could avoid by not decoding Galileo. Restore the job once
          # `aff3ct_jll` ships the wrapper for Windows.
          - os: macOS-latest
            version: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          plugins: noop
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
